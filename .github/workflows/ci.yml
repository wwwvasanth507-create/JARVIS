name: MyLLM CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend Tests & Quality (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install MyLLM with Dev Dependencies
        run: |
          pip install -e .[dev]

      - name: Compile Python Sources
        run: |
          python -m compileall src/ scripts/ tests/

      - name: Run Environment Check
        run: |
          python scripts/check_environment.py

      - name: Run Smoke Model Verification
        run: |
          python scripts/verify_model.py --checkpoint checkpoints/smoke/best.pt --tokenizer checkpoints/smoke/tokenizer.json

      - name: Run Pytest Suite
        run: |
          python -m pytest

  frontend:
    name: Frontend Quality & Build (Node.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Linter (Oxlint)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Run Unit Tests (Vitest)
        working-directory: frontend
        run: npm test -- --exclude src/tests/liveE2E.test.ts
