skill:
  id: system_status
  name: System Status
  version: 1.0.0
  description: Checks running processes and active window state.
  category: builtin
  author: JARVIS Core

  aliases:
    - check status
    - system health
    - running apps

  intents:
    - application.list_running

  tools:
    - application.list_running
    - computer.active_window

  permissions:
    - APPLICATION_CONTROL
    - SCREEN_READ

  risk_level: LOW
  enabled: true

workflow:
  - id: list_apps
    action: application.list_running
    description: Enumerate active processes

  - id: get_window
    action: computer.active_window
    description: Inspect currently focused window
