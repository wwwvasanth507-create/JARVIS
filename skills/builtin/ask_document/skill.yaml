skill:
  id: ask_document
  name: Ask Document
  version: 1.0.0
  description: Answer questions about a document with explicit source grounding citations.
  category: builtin
  author: JARVIS Core

  aliases:
    - ask document
    - query document
    - what does this report say

  intents:
    - document.ask

  tools:
    - document.ask
    - document.search

  permissions:
    - READ_FILES

  risk_level: LOW
  enabled: true

workflow:
  - id: query_doc
    action: document.ask
    description: Perform bounded retrieval and answer question with citations
