# Browser Automation & Internet Access Configuration for JARVIS
# Playwright-based browser engine and session management settings

browser:
  engine: "chromium"              # Browser engine: "chromium", "firefox", "webkit"
  headless: true                  # Set to false for visual browser debugging
  reuse_session: true             # Reuse browser process and context across requests
  persistent_profile: true        # Retain cookies/session state in persistent storage
  user_data_dir: "data/browser_profile" # Directory for persistent browser profile
  download_dir: "data/downloads"  # Directory for controlled browser downloads
  default_timeout_ms: 10000       # Interaction/selector wait timeout in ms
  navigation_timeout_ms: 15000    # Page navigation timeout in ms
  max_extraction_chars: 10000     # Content length limit for page extraction
  max_links_extracted: 30         # Maximum links returned in structured page read
  search_engine_url: "https://html.duckduckgo.com/html/?q=" # Configurable web search provider
  allowed_schemes:
    - "http"
    - "https"
