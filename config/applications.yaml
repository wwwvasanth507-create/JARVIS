# JARVIS Application Registry Configuration
# Maps application aliases to executable names and default launch commands

applications:
  chrome:
    name: "Google Chrome"
    aliases:
      - "chrome"
      - "google chrome"
      - "browser"
      - "web browser"
    executable: "chrome.exe"
    common_paths:
      - "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
      - "C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe"

  notepad:
    name: "Notepad"
    aliases:
      - "notepad"
      - "text editor"
      - "editor"
    executable: "notepad.exe"
    common_paths:
      - "C:\\Windows\\System32\\notepad.exe"

  calc:
    name: "Calculator"
    aliases:
      - "calculator"
      - "calc"
      - "calculatorapp.exe"
      - "applicationframehost.exe"
    executable: "calc.exe"
    common_paths:
      - "C:\\Windows\\System32\\calc.exe"

  vscode:
    name: "Visual Studio Code"
    aliases:
      - "vscode"
      - "code"
      - "vs code"
      - "editor"
    executable: "Code.exe"
    common_paths:
      - "%LOCALAPPDATA%\\Programs\\Microsoft VS Code\\Code.exe"
      - "C:\\Program Files\\Microsoft VS Code\\Code.exe"

  cmd:
    name: "Command Prompt"
    aliases:
      - "cmd"
      - "command prompt"
      - "terminal"
    executable: "cmd.exe"
    common_paths:
      - "C:\\Windows\\System32\\cmd.exe"
