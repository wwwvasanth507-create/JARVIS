# JARVIS Application Control & System Integration Configuration

applications:
  chrome:
    name: "Google Chrome"
    display_name: "Google Chrome Web Browser"
    category: "browsers"
    aliases:
      - "chrome"
      - "google chrome"
      - "browser"
      - "web browser"
    executable: "chrome.exe"
    startup_timeout: 15
    common_paths:
      - "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
      - "C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe"
      - "/usr/bin/google-chrome"
      - "/Applications/Google Chrome.app"

  firefox:
    name: "Mozilla Firefox"
    display_name: "Mozilla Firefox Web Browser"
    category: "browsers"
    aliases:
      - "firefox"
      - "mozilla"
      - "browser"
    executable: "firefox.exe"
    startup_timeout: 15
    common_paths:
      - "C:\\Program Files\\Mozilla Firefox\\firefox.exe"
      - "/usr/bin/firefox"
      - "/Applications/Firefox.app"

  vscode:
    name: "Visual Studio Code"
    display_name: "VS Code Editor"
    category: "development"
    aliases:
      - "vscode"
      - "code"
      - "vs code"
      - "editor"
    executable: "Code.exe"
    startup_timeout: 15
    common_paths:
      - "%LOCALAPPDATA%\\Programs\\Microsoft VS Code\\Code.exe"
      - "C:\\Program Files\\Microsoft VS Code\\Code.exe"
      - "/usr/bin/code"
      - "/Applications/Visual Studio Code.app"

  notepad:
    name: "Notepad"
    display_name: "Windows Notepad"
    category: "utilities"
    aliases:
      - "notepad"
      - "text editor"
    executable: "notepad.exe"
    startup_timeout: 5
    common_paths:
      - "C:\\Windows\\System32\\notepad.exe"

  calc:
    name: "Calculator"
    display_name: "System Calculator"
    category: "utilities"
    aliases:
      - "calculator"
      - "calc"
      - "calculatorapp.exe"
    executable: "calc.exe"
    startup_timeout: 5
    common_paths:
      - "C:\\Windows\\System32\\calc.exe"

  cmd:
    name: "Command Prompt"
    display_name: "Windows Command Prompt"
    category: "system"
    aliases:
      - "cmd"
      - "command prompt"
      - "terminal"
    executable: "cmd.exe"
    startup_timeout: 5
    common_paths:
      - "C:\\Windows\\System32\\cmd.exe"

  spotify:
    name: "Spotify"
    display_name: "Spotify Music Player"
    category: "media"
    aliases:
      - "spotify"
      - "music"
      - "music player"
    executable: "Spotify.exe"
    startup_timeout: 15
    common_paths:
      - "%APPDATA%\\Spotify\\Spotify.exe"
      - "/Applications/Spotify.app"

# Application Groups for multi-app management
groups:
  development:
    - "vscode"
    - "cmd"
  browsers:
    - "chrome"
    - "firefox"
  utilities:
    - "notepad"
    - "calc"

# Protected security and system applications
protected_applications:
  - "Windows Defender"
  - "Antivirus"
  - "Firewall"
  - "Task Manager"
  - "taskmgr.exe"
  - "securityhealthservice.exe"
