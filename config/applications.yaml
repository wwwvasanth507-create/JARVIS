# Controlled Application Registry Mapping

applications:
  browser:
    name: "Google Chrome"
    executable: "chrome.exe"
    launch_command: "start chrome"
    risk_level: "MEDIUM"
    permission: "BROWSER_CONTROL"

  editor:
    name: "Visual Studio Code"
    executable: "Code.exe"
    launch_command: "code"
    risk_level: "LOW"
    permission: "APPLICATION_CONTROL"

  notepad:
    name: "Notepad"
    executable: "notepad.exe"
    launch_command: "notepad"
    risk_level: "LOW"
    permission: "APPLICATION_CONTROL"

  terminal:
    name: "Windows Terminal"
    executable: "wt.exe"
    launch_command: "wt"
    risk_level: "HIGH"
    permission: "RUN_COMMANDS"
