# JARVIS Controlled Shell Subsystem Configuration

shell:
  enabled: true

  # Default & maximum timeout limits (in seconds)
  default_timeout: 30
  max_timeout: 300
  min_timeout: 1

  # Output limits (bytes & lines)
  max_stdout_bytes: 524288      # 512 KB
  max_stderr_bytes: 524288      # 512 KB
  max_output_lines: 2000

  # Background job limits
  max_concurrent_jobs: 5
  max_job_runtime_seconds: 3600 # 1 hour

  # Allowlist of pre-approved commands/executables
  allow_commands:
    - python
    - python3
    - py
    - git
    - node
    - npm
    - npx
    - pip
    - pip3
    - pytest
    - echo
    - dir
    - ls
    - pwd
    - whoami
    - hostname
    - ver
    - uname

  # Denylist of explicitly prohibited commands
  deny_commands:
    - format
    - shutdown
    - reboot
    - init
    - systemctl
    - taskkill  # Allowed only via controlled process termination tool
    - rd /s
    - rm -rf /

  # Operations requiring explicit confirmation
  require_confirmation_for:
    - package_install
    - file_modification
    - process_termination
    - network_operations
    - elevated_operations

  # Sensitive environment variable patterns for automatic redaction
  sensitive_env_patterns:
    - "*PASSWORD*"
    - "*TOKEN*"
    - "*SECRET*"
    - "*KEY*"
    - "*CREDENTIAL*"
    - "*AUTH*"
    - "AWS_*"
    - "AZURE_*"
    - "GCP_*"
