# JARVIS Master System Configuration

system:
  name: "JARVIS"
  version: "0.1.0"
  environment: "development"
  user_alias: "Boss"
  local_first: true
  allow_external_apis: false

logging:
  level: "INFO"
  format: "json"
  log_to_file: true
  file_path: "logs/jarvis.log"

paths:
  config_dir: "config"
  docs_dir: "docs"
  prompts_dir: "prompts"
  knowledge_dir: "knowledge"
  skills_dir: "skills"
  data_dir: "data"
  logs_dir: "logs"
  performance_file: "config/performance.yaml"

model_provider:
  type: "llama_cpp"  # Options: llama_cpp, mock
  model_path: "models/gguf/model-Q4_K_M.gguf"
  context_size: 2048
  temperature: 0.2
  n_threads: 4
  n_gpu_layers: 0  # CPU execution default for Intel UHD 620

security:
  permissions_file: "config/permissions.yaml"
  require_confirmation_above_risk: "MEDIUM"  # HIGH & CRITICAL require explicit Boss approval
  audit_logging: true
