# Wake-Word & Always-Ready Listening Configuration for JARVIS
# CPU-friendly local wake detection settings

wakeword:
  enabled: true
  engine: "local"                 # "local", "openwakeword", "mock"
  phrase: "JARVIS"                # Primary wake phrase
  secondary_phrases:
    - "Hey JARVIS"
  model_path: "models/wakeword/jarvis.onnx"
  sensitivity: 0.5                # Detection sensitivity (0.0 to 1.0)
  cooldown_seconds: 1.0           # Cooldown duration after wake detection
  command_timeout_seconds: 8.0    # Timeout waiting for command after wake word
  acknowledgement: true           # Fast-path immediate response ("Yes, Boss?")
  acknowledgement_text: "Yes, Boss?"
  same_utterance_support: true    # Supports single utterance ("JARVIS, open Chrome.")

audio:
  ownership_timeout_seconds: 5.0  # Max time a module holds microphone ownership lock
  auto_reconnect: true            # Auto recovery on audio device disconnection
