# Skills Subsystem Configuration for JARVIS

skills:
  enabled:
    - open_application
    - find_file
    - open_file
    - web_search
    - system_status

  disabled:
    - experimental_example

  skill_directories:
    - skills/builtin
    - skills/system
    - skills/user
    - skills/experimental

  limits:
    max_steps: 12
    max_execution_time: 300
    max_retries: 1
