# JARVIS Local Model & Inference Runtime Configuration

models:
  default:
    backend: llama_cpp
    path: models/gguf/model-Q4_K_M.gguf
    context_size: 2048
    temperature: 0.2
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.1
    n_threads: auto          # 'auto' calculates optimal CPU threads leaving headroom for OS/UI
    n_batch: 512
    n_gpu_layers: 0          # Explicit 0 for CPU-only inference (no CUDA required)
    use_mlock: false
    use_mmap: true

hardware_profiles:
  active_profile: "auto"     # Options: auto, ULTRA_LOW, LOW, MEDIUM, HIGH, GPU_ACCELERATED

  ULTRA_LOW:                 # < 8GB RAM, 2-4 cores
    threads_modifier: 0.5
    context_size: 1024
    batch_size: 256
    gpu_layers: 0

  LOW:                       # 8GB RAM, 4 cores
    threads_modifier: 0.75
    context_size: 2048
    batch_size: 512
    gpu_layers: 0

  MEDIUM:                    # 16GB RAM, 6-8 cores
    threads_modifier: 0.75
    context_size: 2048
    batch_size: 512
    gpu_layers: 0

  HIGH:                      # 32GB+ RAM, 8+ cores
    threads_modifier: 0.85
    context_size: 4096
    batch_size: 1024
    gpu_layers: 0

  GPU_ACCELERATED:           # GPU hardware detected
    threads_modifier: 1.0
    context_size: 4096
    batch_size: 1024
    gpu_layers: -1

performance_modes:
  active_mode: "auto"        # Options: auto, battery_saver, balanced, performance

  battery_saver:
    threads_modifier: 0.5    # Uses 50% of available CPU cores
    context_size: 1024
    gpu_layers: 0

  balanced:
    threads_modifier: 0.75   # Uses 75% of available CPU cores
    context_size: 2048
    gpu_layers: 0

  performance:
    threads_modifier: 1.0    # Uses all assigned CPU inference cores
    context_size: 4096
    gpu_layers: 0

memory_safety:
  min_free_ram_gb: 1.5       # Prevents loading model if free physical RAM < 1.5GB
  ram_headroom_factor: 1.2   # Requires estimated RAM = model_file_size * 1.2

debug:
  enabled: false             # Set true to print model load timings, token latencies, context assembly
