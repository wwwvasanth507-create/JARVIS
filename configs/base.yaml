# Baseline Configuration for MyLLM (CPU-First GPT from scratch)

# System and hardware execution settings
system:
  # Random seed for reproducibility across Python, NumPy, and PyTorch
  seed: 42

  # Execution device - strictly 'cpu'
  # Attempts to use 'cuda', 'gpu', or 'rocm' will trigger safe rejection
  device: "cpu"

  # Number of CPU threads for intra-op parallelism (null defaults to auto-detected CPU cores)
  num_threads: 4

  # Enforce strict CPU-only execution (disallow GPU even if hardware/CUDA is detected)
  strict_cpu: true

# Directory paths relative to the project root
paths:
  model_dir: "checkpoints"
  checkpoint_dir: "checkpoints"
  dataset_dir: "data"
  log_dir: "logs"
  experiment_dir: "experiments"

# Model architecture specifications (GPT-style decoder-only transformer)
model:
  vocab_size: 1000       # Vocabulary size (matches tokenizer baseline)
  context_length: 128    # Maximum context sequence length
  n_layer: 4             # Number of transformer decoder layers
  n_head: 4              # Number of attention heads (head_dim = 256 / 4 = 64)
  n_embd: 256            # Embedding dimension
  dropout: 0.0           # Dropout probability (0.0 for initial CPU development)
  bias: true             # Linear layer bias
  activation: "gelu"     # Activation function
  weight_tying: true     # Share weights between token embedding and LM head

# Training hyperparameters (optimized for CPU execution)
training:
  batch_size: 16         # Batch size per iteration
  learning_rate: 6.0e-4  # Peak learning rate with AdamW
  min_learning_rate: 6.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  max_iters: 2000
  warmup_iters: 100
  eval_interval: 200
  eval_iters: 50
  save_interval: 500

# Logging and evaluation settings
logging:
  log_level: "INFO"
  log_to_file: true
  log_filename: "myllm.log"

# Byte-Level BPE Tokenizer settings
tokenizer:
  vocab_size: 1000       # Sensible CPU-friendly baseline vocabulary size (>= 260)
  min_pair_frequency: 2  # Minimum occurrences for a token pair to be eligible for merging
  special_tokens:
    - "<PAD>"
    - "<UNK>"
    - "<BOS>"
    - "<EOS>"
  max_documents: null    # Null processes all documents
  max_training_bytes: null
