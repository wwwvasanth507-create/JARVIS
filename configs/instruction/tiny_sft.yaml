# Tiny CPU SFT Profile: Supervised Instruction-Tuning for MyLLM (~137K params)
system:
  seed: 42
  device: "cpu"
  num_threads: 4
  strict_cpu: true

paths:
  model_dir: "checkpoints"
  checkpoint_dir: "experiments/phase7/tiny_sft/checkpoints"
  dataset_dir: "data/instruction"
  log_dir: "logs"
  experiment_dir: "experiments/phase7"

model:
  vocab_size: 512
  context_length: 64
  n_layer: 2
  n_head: 2
  n_embd: 64
  dropout: 0.0
  bias: true
  activation: "gelu"
  weight_tying: true

training:
  batch_size: 4
  max_steps: 1200
  learning_rate: 0.002
  min_learning_rate: 0.0002
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip_norm: 1.0
  warmup_steps: 40
  log_every_steps: 25
  eval_every_steps: 50
  eval_batches: 5
  checkpoint_every_steps: 100
  max_checkpoints: 3
  seed: 42
  gradient_accumulation_steps: 1
  save_best: true
  num_workers: 0

logging:
  log_level: "INFO"
  log_to_file: true
  log_filename: "tiny_sft.log"

tokenizer:
  vocab_size: 512
  min_pair_frequency: 2
  special_tokens:
    - "<PAD>"
    - "<UNK>"
    - "<BOS>"
    - "<EOS>"

instruction:
  base_checkpoint: "experiments/phase6_real_run/checkpoints/best.pt"
  template_version: "1.0"
  mask_prompt_labels: true
  supervise_eos: true
  response_truncation_policy: "reject"
  instruction_data_path: "data/instruction"
